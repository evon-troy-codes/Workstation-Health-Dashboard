# Runs on Windows, macOS and Linux: the unit tests, the renderer build and a
# launch of the real app (tools/smoke.js). Pushes to main and manual runs also
# package an installer per OS and keep it as an artifact of the run.
#
# A green run means the app starts from source on that OS. Packaging runs also
# install each installer and start the installed app the way a user would:
# the .deb on Ubuntu, the NSIS installer on Windows and the Apple silicon .dmg
# on macOS. The installed app proves it rendered and scanned through
# WHD_SELFTEST_FILE (main.js; true/false per reading, no values), checked by
# tools/check-selftest.js. Not exercised: the AppImage, the Intel .dmg, and
# SmartScreen and Gatekeeper, which only act on files a browser downloaded, so
# try those by hand from the run's artifacts.
#
# The macOS build is ad-hoc signed, not signed with an Apple Developer ID, so
# the first open needs Privacy & Security → Open Anyway.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned to a commit SHA, with the release it is in a comment:
# a tag can be moved to other code, a SHA cannot. To update one, take the new
# release's commit from its GitHub page (or `gh api repos/<action>/commits/<tag>
# --jq .sha`) and change both.

concurrency:
  group: ci-${{ github.ref }}
  # Supersede a pull request's older run, but let a push to main finish: its
  # run is what produces the installers.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false # one OS failing should not hide the others' results
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing after this step needs the token

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # Electron 42 fetches its ~100 MB binary the first time it runs, not
      # during npm ci, and setup-node's cache does not cover that.
      - name: Cache the Electron binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~\AppData\Local\electron\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci

      # The report mailer's tests run with the rest and import its own
      # dependencies (the Anthropic SDK for /explain).
      - name: Install the report mailer's dependencies
        run: npm ci --prefix server/report-mailer

      - name: Unit tests
        run: npm test

      - name: Build renderer
        run: npm run build

      # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox
      # needs. Lifting it on the throwaway runner lets the app start from
      # source with its sandbox on. A real Ubuntu 24.04 desktop keeps the
      # restriction, which is why the AppImage does not start there; the .deb
      # installs an AppArmor profile instead, and the step after packaging
      # puts the restriction back to prove that works.
      - name: Allow the Chromium sandbox (Linux)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # WHD_EXPECT fails the run if a detector that should work here answers
      # nothing: the runner is Ubuntu, so apt must report both. Its audio,
      # browser and antivirus rows stay unchecked — a CI runner has no sound
      # server, no browser profile and no antivirus to find.
      - name: Smoke test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" npm run smoke
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # for the Electron download
          WHD_EXPECT: os name,cpu model,ram total,disk total,network interface,pending updates,last update check

      # Windows adds its last-check row, which falls back to the installed
      # update history. Its pending count is deliberately not asserted: the
      # hosted images have Windows Update disabled, so the offline search
      # finds nothing, which says nothing about the app. macOS asserts only
      # the basics until step 3 gives it detectors of its own.
      - name: Smoke test
        if: runner.os != 'Linux'
        run: npm run smoke
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WHD_EXPECT: ${{ runner.os == 'Windows' && 'os name,cpu model,ram total,disk total,network interface,last update check' || 'os name,cpu model,ram total,disk total,network interface' }}

      # Packaging is slow and the artifacts are ~100 MB per OS, so it runs for
      # main and manual runs, not on every pull request.
      - name: Package
        if: github.event_name != 'pull_request'
        run: npx electron-builder --publish never
        env:
          # No Developer ID yet; stop electron-builder hunting the keychain for
          # one. tools/after-pack.js ad-hoc signs the macOS app instead.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # electron-builder downloads its AppImage tooling from GitHub;
          # unauthenticated requests share the runner's rate limit.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The .deb as a user on Ubuntu 24.04 gets it: restriction on, installed
      # with apt, launched from /usr/bin. Its install script's AppArmor profile
      # is the only thing that lets the sandbox start, so an app still running
      # after 20 s means the profile works. Removing the package must take the
      # profile away again.
      - name: Install and launch the .deb (Linux)
        if: runner.os == 'Linux' && github.event_name != 'pull_request'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
          sudo apt-get install -y ./dist/*.deb
          test -f /etc/apparmor.d/workstation-scanner
          echo "chrome-sandbox mode: $(stat -c '%a' '/opt/Workstation Scanner/chrome-sandbox')"
          set +e
          WHD_SELFTEST_FILE="$RUNNER_TEMP/selftest.json" xvfb-run --auto-servernum timeout 30 workstation-scanner > app.log 2>&1
          code=$?
          set -e
          cat app.log
          if [ "$code" -ne 124 ]; then
            echo "::error::the installed app exited with code $code instead of running"
            exit 1
          fi
          if grep -q "FATAL" app.log; then
            echo "::error::the installed app logged a FATAL error"
            exit 1
          fi
          node tools/check-selftest.js "$RUNNER_TEMP/selftest.json" 0 rendered,osName,cpuModel,ramTotal,diskTotal,networkInterface,lastUpdateCheck
          sudo apt-get remove -y workstation-scanner
          test ! -e /etc/apparmor.d/workstation-scanner
          # No broken launcher left behind: postrm must remove the
          # update-alternatives entry, not just try to.
          test ! -e /usr/bin/workstation-scanner && test ! -L /usr/bin/workstation-scanner

      # The NSIS installer as a user runs it, silently, with no admin prompt.
      # Where it installed, and how to remove it quietly, come from the entry
      # it registers under Uninstall in the registry (the one Settings → Apps
      # reads), which this also proves is there. The installed app must render
      # and scan (the self-test), and the uninstaller must remove it.
      - name: Install and launch the installer (Windows)
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist\*.exe | Select-Object -First 1
          Write-Host "installing $($installer.Name)"
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
          $keys = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
                  'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*'
          $entry = Get-ItemProperty $keys -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -like 'Workstation Scanner*' } | Select-Object -First 1
          if (-not $entry) {
            Get-ChildItem "$env:LOCALAPPDATA\Programs", $env:ProgramFiles -Recurse -Filter 'Workstation Scanner.exe' -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "found $($_.FullName)" }
            Write-Error 'no Uninstall entry for Workstation Scanner in the registry'; exit 1
          }
          Write-Host "installed $($entry.DisplayName) $($entry.DisplayVersion) at $($entry.InstallLocation)"
          $exe = Join-Path $entry.InstallLocation 'Workstation Scanner.exe'
          if (-not (Test-Path $exe)) { Write-Error "no app at $exe"; exit 1 }
          $env:WHD_SELFTEST_FILE = Join-Path $env:RUNNER_TEMP 'selftest.json'
          Start-Process -FilePath $exe | Out-Null
          node tools/check-selftest.js $env:WHD_SELFTEST_FILE 90 rendered,osName,cpuModel,ramTotal,diskTotal,networkInterface,lastUpdateCheck
          $ok = $LASTEXITCODE
          Get-Process -Name 'Workstation Scanner' -ErrorAction SilentlyContinue | Stop-Process -Force
          if ($ok -ne 0) { exit $ok }
          # The uninstaller copies itself to a temp folder and returns at once,
          # so wait for the app to go.
          $quiet = if ($entry.QuietUninstallString) { $entry.QuietUninstallString } else { "$($entry.UninstallString) /S" }
          Write-Host "uninstalling: $quiet"
          cmd /c $quiet
          for ($i = 0; $i -lt 60 -and (Test-Path $exe); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $exe) { Write-Error "the uninstaller left $exe behind"; exit 1 }

      # The Apple silicon .dmg (the runner's own architecture): mounted, the app
      # copied to /Applications as a user drags it, its ad-hoc signature still
      # valid after the fuses were flipped (a broken one is what macOS calls
      # "damaged"), then started and self-tested. Not quarantined, so
      # Gatekeeper's first-open prompt isn't exercised.
      - name: Install and launch the .dmg (macOS)
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        run: |
          dmg=$(ls dist/*-arm64.dmg)
          echo "installing $dmg"
          hdiutil attach -nobrowse -readonly -mountpoint /Volumes/wss "$dmg"
          cp -R "/Volumes/wss/Workstation Scanner.app" /Applications/
          hdiutil detach /Volumes/wss
          app="/Applications/Workstation Scanner.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          WHD_SELFTEST_FILE="$RUNNER_TEMP/selftest.json" "$app/Contents/MacOS/Workstation Scanner" > app.log 2>&1 &
          pid=$!
          set +e
          node tools/check-selftest.js "$RUNNER_TEMP/selftest.json" 90 rendered,osName,cpuModel,ramTotal,diskTotal,networkInterface
          ok=$?
          set -e
          kill "$pid" 2>/dev/null || true
          cat app.log
          exit $ok

      - name: Keep the installer
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
          retention-days: 14
