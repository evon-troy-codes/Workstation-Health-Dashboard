<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Workstation Scanner</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!--
  Everything the page loads ships inside the app — no CDN, no runtime JSX
  transform — so this policy needs neither remote origins nor 'unsafe-eval'.
  connect-src is the one exception: the speed test measures against Cloudflare.
  style-src keeps 'unsafe-inline' for the style attribute on the placeholder
  below (React's style prop goes through the CSSOM, which CSP does not gate).
-->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'self';
  style-src 'self' 'unsafe-inline';
  img-src 'self' data:;
  font-src 'self';
  connect-src https://speed.cloudflare.com;
  base-uri 'none';
  form-action 'none';
" />
<link rel="stylesheet" href="helper.css" />
</head>
<body>
<div id="root">
  <div style="font-family: system-ui, sans-serif; padding: 40px; color: var(--text-muted);">
    Scanning workstation…
  </div>
</div>

<!-- React, vendored into dist/ by build.js so launching never needs a network. -->
<script src="dist/vendor/react.js"></script>
<script src="dist/vendor/react-dom.js"></script>
<!-- The renderer, precompiled from the .jsx sources by `npm run build`. -->
<script src="dist/app.js"></script>
</body>
</html>
